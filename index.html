*{box-sizing:border-box}html,body{margin:0;height:100%;background:#ecf2f7;font-family:Arial,Helvetica,sans-serif;color:#0b2e52}body{display:flex;flex-direction:column}.nav{background:#061d3e;color:white;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;box-shadow:0 2px 10px #0003;min-height:62px}.brand{font-weight:900;letter-spacing:.3px;font-size:16px}.brand span{color:#f5bd29}.navtabs{display:flex;gap:7px}.nav button{background:#203d62;color:#fff;border:1px solid #567397;border-radius:9px;font-weight:700;padding:11px 9px;cursor:pointer}.nav button.active{background:#f3bd30;color:#102842;border-color:#ffda79}.frame{flex:1;width:100%;border:0;background:#e7edf4;min-height:0}#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:radial-gradient(circle at 50% 38%,#2c2413 0%,#090909 47%,#010101 100%);color:#eac365;overflow:hidden;transition:opacity .8s ease,visibility .8s}#splash.hide{opacity:0;visibility:hidden;pointer-events:none}#splash::before,#splash::after{content:'';position:absolute;inset:-20%;background:repeating-linear-gradient(118deg,transparent 0 36px,rgba(240,175,37,.065) 37px,transparent 39px 75px);transform:translateX(-65%);animation:sweep 2.7s ease-out both;pointer-events:none}#splash::after{animation-delay:.5s;opacity:.4}#splash .mark{width:min(70vw,340px);border-radius:18px;box-shadow:0 0 45px #ddac3140;animation:rise 1.6s both;z-index:1}#splash strong{z-index:1;letter-spacing:3px;font-size:clamp(17px,4.5vw,26px);animation:rise 1.6s .2s both}#splash small{z-index:1;letter-spacing:2px;color:#e4d0a3;animation:rise 1.6s .45s both;text-align:center}#splash button{z-index:1;margin-top:20px;background:transparent;color:#dab660;border:1px solid #a9873d;padding:9px 19px;border-radius:10px}#splash i{position:absolute;border-radius:50%;background:#f5c04c;box-shadow:0 0 15px #f0aa24;opacity:.7;animation:glow 2s infinite alternate}@keyframes sw const frame=document.getElementById('workspace'),cot=document.getElementById('cotBtn'),mat=document.getElementById('matBtn');function openTab(tab){const materials=tab==='materiales';frame.src=materials?'materiales.html':'cotizacion.html';mat.classList.toggle('active',materials);cot.classList.toggle('active',!materials);history.replaceState(null,'','#'+(materials?'materiales':'cotizacion'))}cot.addEventListener('click',()=>openTab('cotizacion'));mat.addEventListener('click',()=>openTab('materiales'));window.addEventListener('hashchange',()=>openTab(location.hash==='#materiales'?'materiales':'cotizacion'));if(location.hash==='#materiales')openTab('materiales');const splash=document.getElementById('splash');function dismiss(){splash.classList.add('hide')}document.getElementById('skip').onclick=dismiss;setTimeout(dismiss,3100);if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
